[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hominin-morphodynamics"
version = "0.1.0"
description = "Quantitative paleobiology, geometric morphometrics, evolutionary geography, and taphonomic diversification inference for the hominin clade"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "duckdb>=1.0.0",
    "hypothesis>=6.170.15",
    "scipy>=1.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hominin_morphodynamics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "duckdb>=1.0.0",
    "hypothesis>=6.170.15",
    "scipy>=1.17.1",
]
